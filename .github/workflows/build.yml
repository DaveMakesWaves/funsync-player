name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Don't cancel a healthy Windows build because Linux had a network
      # blip. Each OS publishes its own artifact independently — the
      # release job only requires both to have succeeded.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            python: python
          - os: ubuntu-latest
            target: linux
            python: python3

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Run JS tests
        run: npx vitest run

      - name: Setup Python backend
        run: |
          cd backend
          ${{ matrix.python }} -m venv .venv
          ${{ matrix.os == 'windows-latest' && '.venv\\Scripts\\pip' || '.venv/bin/pip' }} install -r requirements.txt
          ${{ matrix.os == 'windows-latest' && '.venv\\Scripts\\python' || '.venv/bin/python' }} -m pytest -v

      - name: Build Python backend with PyInstaller
        run: |
          cd backend
          ${{ matrix.os == 'windows-latest' && '.venv\\Scripts\\pip' || '.venv/bin/pip' }} install pyinstaller
          ${{ matrix.os == 'windows-latest' && '.venv\\Scripts\\python' || '.venv/bin/python' }} -m PyInstaller --distpath ../backend-dist --workpath ../build/pyinstaller --clean funsync-backend.spec

      - name: Download ffmpeg (Linux)
        if: matrix.os == 'ubuntu-latest'
        # Source: BtbN/FFmpeg-Builds. Hosted on GitHub's own CDN so
        # GitHub Actions runners never hit a cloud-IP rate limit (which
        # killed the johnvansickle.com mirror twice during 0.8.0-experimental.0).
        # `latest` tag tracks the current release ffmpeg; the master
        # variant tracks tip-of-master. We want the release variant for
        # stability. `--tries=3 --waitretry=5` adds belt-and-suspenders
        # retries for transient blips.
        run: |
          mkdir -p ffmpeg-linux
          # Pinned to the 8.1 release line to match the Windows bundle
          # (memory: "ffmpeg 8.1 bundled in ffmpeg/ directory"). When
          # bumping the project to a newer ffmpeg version, update both
          # the Windows bundle and this URL together.
          wget --tries=3 --waitretry=5 -q \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz \
            -O ffmpeg-linux.tar.xz
          tar xf ffmpeg-linux.tar.xz --strip-components=1 -C ffmpeg-linux
          # BtbN bundles binaries under bin/ — flatten to match the
          # previous layout so electron-builder / runtime _find_binary
          # logic doesn't need to know about the source change.
          if [ -d ffmpeg-linux/bin ]; then
            mv ffmpeg-linux/bin/ffmpeg ffmpeg-linux/ffmpeg
            mv ffmpeg-linux/bin/ffprobe ffmpeg-linux/ffprobe
          fi
          chmod +x ffmpeg-linux/ffmpeg ffmpeg-linux/ffprobe

      - name: Build Electron app
        # --publish never: electron-builder ONLY builds here; it must NOT
        # create a GitHub release. electron-builder.yml has `publish: github`
        # (needed so electron-updater knows where to look for updates), and
        # on a tag build with a token present electron-builder would otherwise
        # auto-create a DRAFT release for the version. That draft then collides
        # with the `release` job's softprops/action-gh-release on the same
        # tag_name → "Validation Failed: already_exists" → "Too many retries".
        # Two publishers, one tag = the bug that broke every 0.8.0-experimental
        # release. Publishing is centralized in the `release` job below.
        run: npx electron-builder --config electron-builder.yml --${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: funsync-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/funsync-win/*.exe
            artifacts/funsync-win/*.blockmap
            artifacts/funsync-win/latest.yml
            artifacts/funsync-linux/*.AppImage
            artifacts/funsync-linux/*.blockmap
            artifacts/funsync-linux/latest-linux.yml
          draft: false
          # Auto-detect pre-release from the tag name. Any semver suffix
          # (e.g. v0.8.0-experimental.0, v1.0.0-rc.1) marks the GitHub
          # release as a pre-release, which electron-updater respects by
          # default — stable users on `latest` channel won't auto-update
          # to it unless they explicitly opt into pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
