<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://*.handyfeeling.com https://handyfeeling.com https://discuss.eroscripts.com; media-src 'self' file: blob:; img-src 'self' http://localhost:* data: https://discuss.eroscripts.com; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>FunSync Player</title>
  <link rel="stylesheet" href="styles/player.css">
  <link rel="stylesheet" href="styles/library.css">
  <link rel="stylesheet" href="styles/nav-bar.css">
  <link rel="stylesheet" href="styles/modal.css">
  <link rel="stylesheet" href="styles/playlists.css">
  <link rel="stylesheet" href="styles/categories.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/eroscripts.css">
  <link rel="stylesheet" href="styles/session-card.css">
  <link rel="stylesheet" href="styles/up-next.css">
  <link rel="stylesheet" href="styles/vr-format-panel.css">
  <link rel="stylesheet" href="styles/queue-panel.css">
</head>
<body>
  <div id="app">
    <!-- Library View (default landing page) -->
    <div id="library-container" class="library"></div>

    <!-- Playlists View (hidden until opened) -->
    <div id="playlists-container" class="playlists" hidden></div>

    <!-- Categories View (hidden until opened) -->
    <div id="categories-container" class="categories" hidden></div>

    <!-- Video Player Container (hidden until video loaded) -->
    <div id="player-container" class="player-container" hidden>
      <div id="video-wrapper" class="player__video-wrapper">
        <video id="video" class="player__video"></video>

        <!-- Center Play/Pause/Replay Overlay -->
        <button id="center-play-btn" class="center-play" data-i18n-aria-label="player.play" aria-label="Play">
          <span class="center-play__icon center-play__icon--play"><i data-lucide="play"></i></span>
          <span class="center-play__icon center-play__icon--pause" hidden><i data-lucide="pause"></i></span>
          <span class="center-play__icon center-play__icon--replay" hidden><i data-lucide="rotate-ccw"></i></span>
        </button>
      </div>

      <!-- Script Loading Overlay (shown while uploading funscript to Handy cloud) -->
      <div id="script-loading-overlay" class="script-loading-overlay" hidden>
        <div class="script-loading-overlay__content">
          <div class="script-loading-overlay__spinner"></div>
          <div class="script-loading-overlay__text" data-i18n="player.preparingScript">Preparing script…</div>
        </div>
      </div>

      <!-- Controls Overlay -->
      <div id="controls" class="player__controls" role="toolbar" data-i18n-aria-label="player.controlsAria" aria-label="Video player controls">
        <!-- Progress Bar -->
        <div id="progress-container" class="controls__progress" role="slider"
             data-i18n-aria-label="player.progressAria" aria-label="Video progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
             tabindex="0">
          <div class="progress__heatmap" id="heatmap-canvas-container">
            <canvas id="heatmap-canvas" aria-hidden="true"></canvas>
          </div>
          <div class="progress__buffered" id="buffered-bar"></div>
          <div class="progress__filled" id="progress-bar"></div>
          <div class="progress__thumb" id="progress-thumb"></div>
          <div class="progress__tooltip" id="progress-tooltip" aria-hidden="true">
            <div class="tooltip__thumbnail" id="tooltip-thumbnail"></div>
            <span class="tooltip__time" id="tooltip-time">0:00</span>
          </div>
        </div>

        <!-- Bottom Controls -->
        <div class="controls__bottom">
          <div class="controls__left">
            <button id="btn-prev" class="control-btn control-btn--queue" hidden data-i18n-aria-label="player.previous" data-i18n-title="player.previous" aria-label="Previous" title="Previous">
              <i data-lucide="skip-back"></i>
            </button>

            <button id="btn-play" class="control-btn" data-i18n-aria-label="player.play" aria-label="Play" title="Play (K)">
              <span class="icon-play"><i data-lucide="play"></i></span>
              <span class="icon-pause" hidden><i data-lucide="pause"></i></span>
              <span class="icon-replay" hidden><i data-lucide="rotate-ccw"></i></span>
            </button>

            <button id="btn-next" class="control-btn control-btn--queue" hidden data-i18n-aria-label="player.next" data-i18n-title="player.next" aria-label="Next" title="Next">
              <i data-lucide="skip-forward"></i>
            </button>
            <span id="queue-indicator" class="queue-indicator" hidden></span>

            <div class="controls__volume" role="group" data-i18n-aria-label="player.volumeGroupAria" aria-label="Volume controls">
              <!-- Three-state mute icon (Nielsen #1 visibility of state).
                   .icon-volume:    audible (volume > ~50%, not muted)
                   .icon-volume-low: low or zero (volume ≤ 50%, not muted)
                   .icon-muted:     explicitly muted via M key
                   The user can distinguish "I dragged the slider down" from
                   "I pressed M" — different recovery actions for each. -->
              <button id="btn-mute" class="control-btn" data-i18n-aria-label="player.mute" aria-label="Mute" title="Mute (M)">
                <span class="icon-volume"><i data-lucide="volume-2"></i></span>
                <span class="icon-volume-low" hidden><i data-lucide="volume-1"></i></span>
                <span class="icon-muted" hidden><i data-lucide="volume-x"></i></span>
              </button>
              <input type="range" id="volume-slider" class="volume-slider"
                     min="0" max="100" value="100"
                     data-i18n-aria-label="player.volume" data-i18n-title="player.volume"
                     aria-label="Volume" title="Volume">
            </div>

            <div class="controls__time" aria-live="polite">
              <span id="time-current">0:00</span>
              <span class="time-separator">/</span>
              <span id="time-duration">0:00</span>
            </div>
          </div>

          <!-- Right side organised into 3 conceptual clusters separated
               by subtle wider gaps (Norman conceptual model + Shneiderman
               #1 consistency). The .controls-cluster-gap spacer is
               purely visual; aria-hidden so screen readers skip it.

                 [SCRIPT cluster]    funscript / variant / subtitle / editor
                 [DEVICE cluster]    handy
                 [WINDOW cluster]    pip / fullscreen
          -->
          <div class="controls__right">
            <span id="funscript-badge" class="funscript-badge" hidden data-i18n-title="player.funscriptLoaded" title="Funscript loaded"></span>
            <div id="variant-selector" class="variant-selector" hidden>
              <button id="variant-btn" class="variant-selector__btn" data-i18n-title="player.scriptVariants" title="Script variants (V)">
                <span id="variant-btn-label" class="variant-selector__label"></span>
                <i data-lucide="chevron-down" class="variant-selector__chevron"></i>
              </button>
              <div id="variant-dropdown" class="variant-selector__dropdown" hidden></div>
            </div>
            <span id="subtitle-badge" class="subtitle-badge" hidden data-i18n-title="player.subtitlesLoaded" title="Subtitles loaded"></span>

            <!-- Playback-speed chip — follows the funscript/subtitle/
                 variant badge pattern (hidden at default, visible at
                 non-default state). Only appears at non-1× rates so the
                 bar stays clean for the 95% of users at normal speed.
                 Clickable to open the preset popover; discovery for 1×
                 users happens via the ⋮ menu "Playback speed" item or
                 the < / > keyboard shortcuts. Nielsen #1 visibility of
                 system status (applied where it matters: non-default
                 state), #8 minimalist, Shneiderman #8 memory load. -->
            <button id="speed-chip" class="speed-chip" hidden
                    data-i18n-aria-label="player.speed.aria"
                    data-i18n-title="player.speed.title"
                    aria-label="Playback speed"
                    title="Playback speed (&lt; / &gt;)"
                    aria-haspopup="menu" aria-expanded="false">
              <span class="speed-chip__label" id="speed-chip-label">1&times;</span>
            </button>
            <!-- Loop chip — mirrors the speed-chip pattern: hidden by
                 default, visible only when loop is on. Click opens the
                 same overflow ⋮ menu so the user has a single canonical
                 control surface. Reads-as-status when present, action
                 when clicked. -->
            <button id="loop-chip" class="speed-chip" hidden
                    data-i18n-aria-label="player.loopVideo.chipAria"
                    data-i18n-title="player.loopVideo.chipTitle"
                    aria-label="Loop video on"
                    title="Loop video (Shift+L)"
                    aria-pressed="true">
              <i data-lucide="repeat-1"></i>
            </button>

            <!-- Editor / Devices / Fullscreen carry persistent text
                 labels at ≥1024px so first-time users don't have to
                 hover-learn their icons (Norman signifier; Nielsen #6
                 recognition over recall). The .control-btn--labelled
                 class drives the responsive show/hide via CSS. -->
            <button id="btn-editor" class="control-btn control-btn--labelled" data-i18n-aria-label="player.scriptEditor" data-i18n-title="player.scriptEditor" aria-label="Script Editor" title="Script Editor (E)" hidden>
              <i data-lucide="pencil"></i>
              <span class="control-btn__label" data-i18n="player.editor">Editor</span>
            </button>

            <span class="controls-cluster-gap" aria-hidden="true"></span>

            <!-- Devices button — was a `bluetooth` icon, but Handy uses
                 WiFi (HSSP), TCode uses USB serial, and Buttplug can be
                 anything Intiface speaks. The bluetooth icon misled
                 users into thinking the app was BT-only. `cable` reads
                 as "the connection thing" without committing to a
                 specific transport (Nielsen #2 match real world). -->
            <button id="btn-handy" class="control-btn control-btn--handy control-btn--labelled" data-i18n-aria-label="player.deviceConnection" data-i18n-title="player.devicesTitle" aria-label="Device Connection" title="Devices Connection (H)">
              <span class="icon-handy"><i data-lucide="cable"></i></span>
              <span class="handy-led" id="handy-led"></span>
              <span class="control-btn__label" data-i18n="player.devices">Devices</span>
            </button>

            <span class="controls-cluster-gap" aria-hidden="true"></span>

            <!-- Overflow menu — niche actions (PiP, future help link)
                 collapse behind a `⋮` trigger so the bar stays scannable.
                 Fullscreen and Devices stay first-class (most-used
                 aux features). PiP is invoked rarely in a single-window
                 desktop app — Nielsen #8 minimalist + Shneiderman #8
                 memory load. -->
            <div class="controls-overflow" id="controls-overflow">
              <button id="btn-overflow" class="control-btn"
                      data-i18n-aria-label="player.moreOptions" data-i18n-title="player.more"
                      aria-label="More options" title="More"
                      aria-haspopup="menu" aria-expanded="false">
                <i data-lucide="ellipsis-vertical"></i>
              </button>
              <div id="controls-overflow-menu" class="controls-overflow__menu" role="menu" hidden>
                <!-- Playback speed — the main discovery surface. Shows
                     current rate inline so users see system status
                     without opening the submenu. Activates a popover
                     anchored to the ⋮ button with the preset list. -->
                <button id="btn-speed-menu" class="controls-overflow__item" role="menuitem" aria-haspopup="menu" data-i18n-aria-label="player.speed.aria" aria-label="Playback speed">
                  <i data-lucide="gauge"></i>
                  <span data-i18n="player.speed.menuLabel">Playback speed</span>
                  <span class="controls-overflow__item-value" id="speed-menu-current">1&times;</span>
                </button>
                <!-- VR Format — surfaced here only for videos detected
                     (or manually flagged) as VR. Gives users a way to
                     fix mis-detected projection without leaving the
                     player view. Hidden by default; app.js toggles
                     visibility based on isVRVideo(currentPath). -->
                <button id="btn-vr-format-menu" class="controls-overflow__item" role="menuitem" data-i18n-aria-label="player.vrFormatMenu" aria-label="VR Format" hidden>
                  <i data-lucide="rectangle-goggles"></i>
                  <span data-i18n="player.vrFormatMenu">VR Format…</span>
                </button>
                <!-- Loop video — toggle that sets video.loop on the active
                     <video>. Browser handles the seek-to-0, no `ended`
                     fires, Up Next gets suppressed automatically (already
                     handled by `_syncUpNextSuppression`). Session-scoped:
                     resets to off whenever a new video loads, same shape
                     as Playback Speed. Shift+L keyboard shortcut. -->
                <button id="btn-loop-video" class="controls-overflow__item" role="menuitemcheckbox" aria-checked="false" data-i18n-aria-label="player.loopVideo.aria" aria-label="Loop video">
                  <i data-lucide="repeat-1"></i>
                  <span data-i18n="player.loopVideo.menuLabel">Loop video</span>
                  <span class="controls-overflow__item-value" id="loop-video-state" data-i18n="player.loopVideo.stateOff">Off</span>
                </button>
                <button id="btn-pip" class="controls-overflow__item" role="menuitem" data-i18n-aria-label="player.pictureInPicture" aria-label="Picture in Picture">
                  <i data-lucide="picture-in-picture-2"></i>
                  <span data-i18n="player.pictureInPicture">Picture-in-Picture</span>
                </button>
                <button id="btn-help" class="controls-overflow__item" role="menuitem" data-i18n-aria-label="player.keyboardShortcuts" aria-label="Keyboard shortcuts">
                  <i data-lucide="keyboard"></i>
                  <span data-i18n="player.keyboardShortcuts">Keyboard shortcuts</span>
                </button>
              </div>
              <!-- Shared preset popover — anchored to whichever trigger
                   opens it (the chip or the ⋮ menu item). -->
              <div id="speed-popover" class="speed-popover" role="menu" hidden></div>
            </div>

            <button id="btn-fullscreen" class="control-btn control-btn--labelled" data-i18n-aria-label="player.fullscreen" data-i18n-title="player.fullscreen" aria-label="Fullscreen" title="Fullscreen (F)">
              <span class="icon-expand"><i data-lucide="maximize"></i></span>
              <span class="icon-compress" hidden><i data-lucide="minimize"></i></span>
              <span class="control-btn__label" data-i18n="player.fullscreen">Fullscreen</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Top Bar Overlay (back button + title + sync chip + category dots + quick-add)
           The sync chip is a single-source-of-truth indicator for device sync
           state — aggregates Handy + Buttplug + TCode + Autoblow into one
           label visible at the top of the player view (Nielsen #1 visibility
           of system status). Live region so screen readers announce
           transitions ("Syncing • 2 devices" → "Disconnected"). -->
      <div class="player__top-bar">
        <button id="btn-player-back" class="player__back-btn" data-i18n-aria-label="player.back" data-i18n-title="player.back" aria-label="Back" title="Back"><i data-lucide="arrow-left"></i></button>
        <div id="video-title" class="player__title" aria-live="polite"></div>
        <div id="player-sync-chip" class="player__sync-chip" role="status" aria-live="polite" hidden>
          <span class="player__sync-chip-dot" aria-hidden="true"></span>
          <span id="player-sync-chip-text" class="player__sync-chip-text"></span>
        </div>
        <div id="video-category-dots" class="player__category-dots"></div>
        <button id="btn-add-to-playlist" class="player__quick-add" data-i18n-aria-label="player.addToPlaylist" data-i18n-title="player.addToPlaylist" aria-label="Add to playlist" title="Add to Playlist"><i data-lucide="plus"></i></button>
        <!-- Queue panel toggle — far-right corner of the top bar. The
             columns-2 icon mirrors the Android Auto split-screen look
             (two side-by-side panels). Shift+Q keyboard shortcut also
             toggles. See SCOPE-queue-panel.md §3.8. -->
        <button id="btn-queue-toggle" class="player__queue-toggle" type="button"
                data-i18n-aria-label="queuePanel.toggleAria"
                data-i18n-title="queuePanel.toggleTooltip"
                aria-label="Toggle queue panel" title="Queue (Shift+Q)"
                aria-pressed="false" aria-controls="queue-panel" aria-expanded="false">
          <i data-lucide="columns-2"></i>
        </button>
      </div>

      <!-- Gap Skip Overlay -->
      <div id="gap-skip-overlay" class="gap-skip" hidden>
        <button id="gap-skip-btn" class="gap-skip__btn" data-i18n="player.skipToNextAction">Skip to next action</button>
        <button id="gap-skip-cancel" class="gap-skip__cancel" hidden data-i18n="common.cancel">Cancel</button>
      </div>

      <!-- Up Next card (end-of-video autoplay countdown) -->
      <div id="up-next-card" class="up-next" hidden></div>

      <!-- Queue panel mount — slides in from right edge of the player.
           Component populates content at runtime. SCOPE-queue-panel.md. -->
      <aside id="queue-panel" hidden></aside>
    </div>
  </div>

  <!-- Backend-disconnected banner — shown when the Python FastAPI
       backend dies / fails to start / hangs. Most app features keep
       working (playback uses file:// URLs, no backend dependency) but
       library scans / thumbnails / metadata / VR / web-remote all
       require the backend, so the user needs a clear signal + an
       actionable fix when it's down. Hidden by default; main process
       sends `backend-status` via IPC on state transitions and the
       renderer toggles `hidden` accordingly. -->
  <div id="backend-banner" class="backend-banner" hidden role="alert" aria-live="polite">
    <div class="backend-banner__inner">
      <svg class="backend-banner__icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div class="backend-banner__body">
        <div class="backend-banner__title" id="backend-banner-title" data-i18n="backend.title">Backend is not responding</div>
        <div class="backend-banner__detail" id="backend-banner-detail" data-i18n="backend.detail">Library scans, thumbnails, and VR features need it. Playback still works for already-open files.</div>
      </div>
      <div class="backend-banner__actions">
        <button id="backend-banner-restart" class="backend-banner__btn backend-banner__btn--primary" type="button" data-i18n="backend.restart">Restart Backend</button>
        <button id="backend-banner-logs" class="backend-banner__btn" type="button" data-i18n="backend.viewLogs">View Logs</button>
        <button id="backend-banner-dismiss" class="backend-banner__close" type="button" data-i18n-aria-label="backend.dismiss" aria-label="Dismiss banner">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Drop-zone overlay — full-screen visual feedback during file drag.
       Was a no-op before 2026-04-28 (DragDrop class accepted a dropZone
       element but app.js passed `null`, so dragenter classes never landed
       anywhere). Now a real overlay that surfaces "you can drop here"
       (Nielsen #1 visibility) and a rejected variant for unsupported
       file types (Nielsen #5 error prevention). -->
  <div id="drop-zone-overlay" class="drop-zone-overlay" hidden aria-hidden="true">
    <div class="drop-zone-overlay__inner">
      <svg class="drop-zone-overlay__icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
        <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
        <path d="M12 18v-6"/>
        <path d="m9 15 3 3 3-3"/>
      </svg>
      <div class="drop-zone-overlay__title" data-i18n="dropZone.title">Drop to load</div>
      <div class="drop-zone-overlay__subtitle" data-i18n="dropZone.subtitle">Video, funscript, or subtitle file</div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="js/process-shim.js"></script>
  <script src="js/app.js" type="module"></script>
</body>
</html>
